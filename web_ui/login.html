<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#d97736" />
    <title>DATN — Đăng nhập</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;700&family=Source+Sans+3:wght@400;500;600;700&display=swap&subset=latin,latin-ext,vietnamese"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=warm1" />
  </head>
  <body>
    <div class="mesh" aria-hidden="true"></div>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/ui/" aria-label="Trang chủ">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-text">
            <span class="brand-name">DATN</span>
            <span class="brand-tag brand-tag--soft">Đăng nhập hệ thống</span>
          </span>
        </a>
        <button type="button" class="theme-btn" id="themeToggle" aria-label="Đổi giao diện sáng/tối">
          <span class="icon-moon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
            </svg>
          </span>
          <span class="icon-sun hidden" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
            </svg>
          </span>
        </button>
      </div>
    </header>

    <main class="main auth-main">
      <section class="card auth-card">
        <h1 class="card-title">Đăng nhập để dùng tính năng AI</h1>
        <p class="muted small">Luồng demo mặc định: Đăng nhập -> Nhân viên y tế -> Nhập tài liệu phân tích.</p>
        <form id="loginForm" class="medical-form">
          <div class="field">
            <label for="username">Tài khoản</label>
            <input id="username" name="username" type="text" placeholder="admin" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">Mật khẩu</label>
            <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
          </div>
          <div class="row-actions">
            <button type="submit" class="btn primary" id="loginBtn">Đăng nhập</button>
            <a class="btn ghost" href="/ui/">Về trang chủ</a>
          </div>
          <p id="loginStatus" class="pill-status"></p>
        </form>
      </section>
    </main>

    <script src="auth.js?v=warm1"></script>
    <script>
      const STORAGE_THEME = "datn_ui_theme";

      function applyTheme() {
        const saved = localStorage.getItem(STORAGE_THEME);
        let dark = false;
        if (saved === "dark") dark = true;
        else if (saved === "light") dark = false;
        else dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        const moon = document.querySelector(".icon-moon");
        const sun = document.querySelector(".icon-sun");
        if (moon && sun) {
          moon.classList.toggle("hidden", dark);
          sun.classList.toggle("hidden", !dark);
        }
      }

      function toggleTheme() {
        const next = !document.documentElement.classList.contains("dark");
        localStorage.setItem(STORAGE_THEME, next ? "dark" : "light");
        applyTheme();
      }

      document.addEventListener("DOMContentLoaded", async () => {
        applyTheme();
        document.getElementById("themeToggle")?.addEventListener("click", toggleTheme);
        const form = document.getElementById("loginForm");
        const status = document.getElementById("loginStatus");
        const btn = document.getElementById("loginBtn");

        if (await window.DATNAuth.verifySession()) {
          window.location.href = "/ui/dashboard.html";
          return;
        }

        form?.addEventListener("submit", async (event) => {
          event.preventDefault();
          const username = document.getElementById("username").value.trim();
          const password = document.getElementById("password").value;
          status.textContent = "Đang đăng nhập...";
          status.className = "pill-status";
          btn.disabled = true;
          try {
            await window.DATNAuth.login(username, password);
            status.textContent = "Đăng nhập thành công. Đang chuyển trang...";
            status.className = "pill-status ok";
            const next = new URLSearchParams(window.location.search).get("next") || "/ui/dashboard.html";
            window.location.href = next.startsWith("/ui/") ? next : "/ui/dashboard.html";
          } catch (error) {
            status.textContent = `Lỗi: ${error.message || "Không thể đăng nhập."}`;
            status.className = "pill-status err";
          } finally {
            btn.disabled = false;
          }
        });
      });
    </script>
  </body>
</html>
