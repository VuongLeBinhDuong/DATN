# Neo4j cho GraphRAG: import từ graphrag/output (scripts/graphrag_parquet_to_neo4j.py).
# Chạy: docker compose -p datn-neo4j -f deploy/docker-compose.neo4j.yml up -d (ten container: datn-neo4j-neo4j-1)
# Trình duyệt: http://localhost:7474  (Bolt: localhost:7687) — app dùng localhost, không cần tên container.
services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/changeme
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
volumes:
  neo4j_data:
  neo4j_logs:
