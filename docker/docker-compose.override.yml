# Development override - enables hot-reload
# Usage: docker-compose up (auto-loads this file)

services:
  api:
    volumes:
      # Mount source code for hot-reload (read-only to avoid permission issues)
      - ../agent:/app/agent:ro
      - ../api:/app/api:ro
      - ../core:/app/core:ro
      - ../repositories:/app/repositories:ro
      - ../services:/app/services:ro
      - ../llm_pipeline:/app/llm_pipeline:ro
      - ../medical_records:/app/medical_records:ro
      # Data directories (read-write)
      - ../graphrag:/app/graphrag:rw
      - ../upload:/app/upload:rw
      - ../config:/app/config:ro
    environment:
      # Prevent Python from writing __pycache__
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      # Signal to settings.py to skip loading .env files
      - RUNNING_IN_DOCKER=1
    # Override command with hot-reload
    command: >
      python -m uvicorn api.main:app 
      --host 0.0.0.0 
      --port 8000 
      --reload 
      --reload-dir /app/agent
      --reload-dir /app/api
      --reload-dir /app/core
      --reload-dir /app/repositories
      --reload-dir /app/services
      --reload-dir /app/llm_pipeline
      --reload-dir /app/medical_records
