# Docker Compose for DATN Medical RAG System
# Full stack with API, Neo4j, and optional Milvus

services:
  # ==========================================================================
  # Ollama LLM (Docker container - Giống ollama-docker project)
  # ==========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: datn-ollama
    restart: unless-stopped
    # Port 7869 (giống ollama-docker, khác với native 11434)
    ports:
      - "7869:11434"
    # Bind mount volume giống ollama-docker
    volumes:
      - ./ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=24h
    networks:
      - datn-network
    # GPU support - Giống ollama-docker
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ==========================================================================
  # Main API Application
  # ==========================================================================
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    container_name: datn-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # ==== LỰA CHỌN 1: Ollama Docker (Khuyên dùng - Clean) ====
      - USE_OLLAMA=1
      # 🔥 Internal DNS: api → ollama (cùng Docker network)
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b
      
      - RUNNING_IN_DOCKER=1
      # ==== LỰA CHỌN 2: Ollama Local (Windows host - Debug) ====
      # NOTE: Port đã đổi thành 11434:11434 để dùng chung
      # - USE_OLLAMA=1
      # - OLLAMA_HOST=http://host.docker.internal:11434
      # - OLLAMA_MODEL=llama3.1:8b
      
      # ==== LỰA CHỌN 3: API Key (OpenRouter - Free tier) ====
      # - USE_OLLAMA=0
      # - LLM_BACKEND=openrouter
      # - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # - OPENROUTER_MODEL=google/gemini-2.0-flash-thinking-exp:free
      - OLLAMA_TIMEOUT=300
      
      # Neo4j settings
      - NEO4J_ENABLED=true
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=changeme
      
      # Agent settings
      - AGENT_USE_REACT=true
      - AGENT_REACT_MAX_ITER=5
      - AGENT_TRACE=false
      
      # Rate limiting
      - RATE_LIMIT_MAX_PER_WINDOW=100
      - RATE_LIMIT_WINDOW_SEC=60
      
      # CORS
      - CORS_ORIGINS=*
      
      # Logging
      - LOG_LEVEL=INFO
      
    # Volumes defined in docker-compose.override.yml for dev mode
    # No volumes in production mode (code baked into image)
    depends_on:
      neo4j:
        condition: service_started
      ollama:
        condition: service_started
    networks:
      - datn-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================================================
  # Neo4j Graph Database
  # ==========================================================================
  neo4j:
    image: neo4j:5.26-community
    container_name: datn-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      NEO4J_AUTH: neo4j/changeme
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      # Memory tuning cho RAG (rất quan trọng)
      NEO4J_dbms_memory_heap_initial__size: 1G
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
    volumes:
      # Persist Neo4j data
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - datn-network

# ==========================================================================
# Networks
# ==========================================================================
networks:
  datn-network:
    driver: bridge

# ==========================================================================
# Volumes
# ==========================================================================
volumes:
  neo4j-data:
  neo4j-logs:
  neo4j-import:
  neo4j-plugins:
  # Ollama dùng bind mount ./ollama thay vì named volume
